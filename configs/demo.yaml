seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  clips_dir: data/clips
  features_dir: data/features
  num_frames: 8
  image_size: 160
  classes:
    - non_violence
    - violence
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  demo_videos_per_class: 10
  demo_source_frames: 32

model:
  backbone: resnet50
  pretrained: false
  freeze_backbone: true
  lstm_hidden: 128
  lstm_layers: 1
  bidirectional: true
  dropout: 0.3
  use_attention: true
  num_classes: 2

train:
  batch_size: 4
  epochs: 12
  lr: 0.001
  backbone_lr: 0.00001
  weight_decay: 0.0001
  num_workers: 0
  patience: 6
  use_amp: false
  checkpoint_dir: checkpoints
  log_dir: reports/outputs

infer:
  window_frames: 8
  stride: 4
  threshold: 0.5
