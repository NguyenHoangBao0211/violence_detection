data:
  num_frames: 16
  image_size: 224
  classes:
    - non_violence
    - violence

model:
  backbone: resnet50
  pretrained: true
  freeze_backbone: false
  lstm_hidden: 512
  lstm_layers: 2
  bidirectional: true
  dropout: 0.5
  use_attention: false
  num_classes: 2

infer:
  window_frames: 16
  stride: 8
  # Cần 3 cửa sổ liên tiếp đạt 60% mới kết luận bạo lực.
  threshold: 0.6
